<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<style>


body 
{ font-family: Arial, Helvetica, sans-serif;
   background: #f7f9f8; color: #333; }
/* Main container */ .container 
{ width: 900px; max-width: 92%;
   margin: 40px auto; background: white;
    padding: 30px;
     border-radius: 8px; }
/* Header */ header
 { display: flex;
   justify-content: space-between;
    align-items: flex-start;
     margin-bottom: 25px; }
header h1 
{ font-size: 27px;
   font-weight: 700; 
   margin-bottom: 7px;
  text-align: center; }
header p
 { font-size: 14px;
   color: #999;
  text-align: center;
margin-top: 20px; }
.close { border: none; background: transparent; font-size: 28px; color: #777; cursor: pointer; line-height: 20px; }
/* Grid */ .destinations { display: grid; grid-template-columns: repeat(3, 1fr); gap: 22px; }
/* Card */ .card { background: #fff; border: 1px solid #eeeeee; border-radius: 10px; overflow: hidden; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04); transition: 0.3s; }
.card:hover { transform: translateY(-4px); box-shadow: 0 8px 20px rgba(0, 0, 0, 0.10); }
/* Image */ .card img { width: 100%; height: 175px; display: block; object-fit: cover; }
/* Card information */ .card-info { min-height: 105px; padding: 17px 16px;
display: flex;
align-items: center;
justify-content: space-between;
}
.card-info h2 { font-size: 17px; margin-bottom: 8px; }
.card-info p { font-size: 12px; color: #999; }
/* Arrow button */ .arrow { width: 31px; height: 31px;
border: none;
border-radius: 50%;

background: #39aeb0;
color: white;

font-size: 24px;
line-height: 25px;

cursor: pointer;

display: flex;
align-items: center;
justify-content: center;

transition: 0.2s;
}
.arrow:hover { background: #278f91; transform: scale(1.08); }
/* Responsive */ @media (max-width: 750px) {
.destinations {
    grid-template-columns: repeat(2, 1fr);
}
}
@media (max-width: 500px) {
.container {
    padding: 20px;
}

.destinations {
    grid-template-columns: 1fr;
}

.card img {
    height: 200px;
}
}
</style>
<body>
  <link rel="stylesheet" href="style.css">
<div class="container">

    <header>
       
         <h1>Destinations</h1>
            <p>Find your next favorite place</p>
      

        <button class="close">×</button>
    </header>


    <div class="destinations">

        <!-- Maldives -->
        <div class="card">
            <img src="https://images.unsplash.com/photo-1514282401047-d79a71a590e8?auto=format&fit=crop&w=700&q=80"
                 alt="Maldives">

            <div class="card-info">
                <div>
                    <h2>Maldives</h2>
                    <p>Escape to paradise</p>
                </div>

                <button class="arrow">›</button>
            </div>
        </div>


        <!-- Dubai -->
        <div class="card">
            <img src="https://images.unsplash.com/photo-1512453979798-5ea266f8880c?auto=format&fit=crop&w=700&q=80"
                 alt="Dubai">

            <div class="card-info">
                <div>
                    <h2>Dubai</h2>
                    <p>Modern & Luxury</p>
                </div>

                <button class="arrow">›</button>
            </div>
        </div>


        <!-- Rome -->
        <div class="card">
            <img src="https://images.unsplash.com/photo-1552832230-c0197dd311b5?auto=format&fit=crop&w=700&q=80"
                 alt="Rome">

            <div class="card-info">
                <div>
                    <h2>Rome</h2>
                    <p>The Eternal City</p>
                </div>

                <button class="arrow">›</button>
            </div>
        </div>


        <!-- Kyoto -->
        <div class="card">
            <img src="https://images.unsplash.com/photo-1493976040374-85c8e12f0c0e?auto=format&fit=crop&w=700&q=80"
                 alt="Kyoto">

            <div class="card-info">
                <div>
                    <h2>Kyoto</h2>
                    <p>Tradition & Culture</p>
                </div>

                <button class="arrow">›</button>
            </div>
        </div>


        <!-- New York -->
        <div class="card">
            <img src="https://images.unsplash.com/photo-1522083165195-3424ed129620?auto=format&fit=crop&w=700&q=80"
                 alt="New York">

            <div class="card-info">
                <div>
                    <h2>New York</h2>
                    <p>The City that Never Sleeps</p>
                </div>

                <button class="arrow">›</button>
            </div>
        </div>


        <!-- Cape Town -->
        <div class="card">
            <img src="https://images.unsplash.com/photo-1580060839134-75a5edca2e99?auto=format&fit=crop&w=700&q=80"
                 alt="Cape Town">

            <div class="card-info">
                <div>
                    <h2>Cape Town</h2>
                    <p>Mountains & Ocean</p>
                </div>

                <button class="arrow">›</button>
            </div>
        </div>

    </div>

</div>
</body>
</html>
