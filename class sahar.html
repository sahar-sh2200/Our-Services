<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css" integrity="sha512-ApSLB1Pd3/bZN8fWB/RG9YhN/7bd9Hkf3AGaE2mPfebjrxagjuBtx2GcgdqIlJkUzwylBo61r9Xa9NmgBI0swA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <title>Document</title>
</head>
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    background: #fff;
    display: flex;
    justify-content: center;
    align-items: center;
}

.container {
    width: 850px;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 45px;
}

.icon {
    width: 250px;
    height: 250px;

    border-radius: 50%;

    display: flex;
    justify-content: center;
    align-items: center;

    font-size: 85px;
    color: white;

    border: 6px solid;
    box-shadow: inset 0 0 0 30px white;
    position: relative;
}

.icon::before {
    content: "";
    position: absolute;

    width: 195px;
    height: 195px;

    border-radius: 50%;
    z-index: 0;
}

.icon i {
    position: relative;
    z-index: 1;
}



.facebook {
    border-color: #4267a9;
}

.facebook::before {
    background: #4267a9;
}

.twitter {
    border-color: #2998e8;
}

.twitter::before {
    background: #2998e8;
}



.instagram {
    border-color: #14547a;
}

.instagram::before {
    background: #14547a;
}

.linkedin {
    border-color: #477fbd;
}

.linkedin::before {
    background: #477fbd;
}



.google {
    border-color: #df3d2d;
}

.google::before {
    background: #df3d2d;
}



.youtube {
    border-color: #c90000;
}

.youtube::before {
    background: #c90000;
}
</style>

<body>

    <div class="container">

        <div class="icon facebook">
            <i class="fa-brands fa-facebook-f"></i>
        </div>

        <div class="icon twitter">
            <i class="fa-brands fa-twitter"></i>
        </div>

        <div class="icon instagram">
            <i class="fa-brands fa-instagram"></i>
        </div>

        <div class="icon linkedin">
            <i class="fa-brands fa-linkedin-in"></i>
        </div>

        <div class="icon google">
            <i class="fa-brands fa-google-plus-g"></i>
        </div>

        <div class="icon youtube">
            <i class="fa-brands fa-youtube"></i>
        </div>

    </div>

</body>
</html>
